[package]
name = "box_client"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Ascii Box Public API v1 (TypeScript BoxApi-shaped)"
license = "MIT"
repository = "https://github.com/nessalabs/asciibox-client-rs"
homepage = "https://github.com/nessalabs/asciibox-client-rs"
readme = "README.md"
keywords = ["ascii", "box", "sandbox", "cloud"]
categories = ["api-bindings", "asynchronous"]
rust-version = "1.74"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
